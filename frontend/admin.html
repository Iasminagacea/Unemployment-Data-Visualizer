<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>UnD - Modul Administrare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #ccc;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-logout {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 1rem;
        }

        .btn-logout:hover {
            background-color: #b71c1c;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Modul Administrare - Import Date Șomaj</h1>
        <div class="header-actions">
            <button class="btn-logout" id="btn-logout">Logout</button>
        </div>
    </header>

    <form id="importForm" enctype="multipart/form-data">
        <div class="form-group">
            <label>Anul:</label>
            <input type="number" id="an" name="an" value="2024" required>
        </div>
        <div class="form-group">
            <label>Luna (1-12):</label>
            <input type="number" id="luna" name="luna" min="1" max="12" required>
        </div>

        <hr>

        <div class="form-group">
            <label>1. Fișier CSV General (Total, Femei, Bărbați):</label>
            <input type="file" id="csv_general" name="csv_general" accept=".csv" required>
        </div>
        <div class="form-group">
            <label>2. Fișier CSV Mediu (Urban/Rural):</label>
            <input type="file" id="csv_mediu" name="csv_mediu" accept=".csv" required>
        </div>
        <div class="form-group">
            <label>3. Fișier CSV Vârstă (Sub 25, 25-29, etc.):</label>
            <input type="file" id="csv_varsta" name="csv_varsta" accept=".csv" required>
        </div>
        <div class="form-group">
            <label>4. Fișier CSV Educație (Fără studii, Primar, etc.):</label>
            <input type="file" id="csv_educatie" name="csv_educatie" accept=".csv" required>
        </div>

        <button type="submit">Importă Datele</button>
    </form>

    <hr>
    <div id="statusMessage"></div>    
    <script>
        fetch('../backend/api/check_auth.php')
            .then(response => response.json())
            .then(data => {
                if (!data.authenticated) {
                    window.location.href = 'login.html';
                }
            });

        document.getElementById('btn-logout').addEventListener('click', function() {
            if (confirm('Sigur vrei să ieși din cont?')) {
                fetch('../backend/api/logout.php', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = 'login.html';
                    }
                })
                .catch(error => {
                    console.error('Logout error:', error);
                    alert('Eroare de rețea! Nu am putut comunica cu serverul pentru delogare.'); 
                });
            }
        });

        document.getElementById('importForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const statusDiv = document.getElementById('statusMessage');

            statusDiv.innerHTML = "<b>Se procesează datele... Te rugăm să aștepți.</b>";
            statusDiv.style.color = "blue";

            fetch('../backend/api/import.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const anImportat = document.getElementById('an').value;
                    const lunaImportata = document.getElementById('luna').value;

                    statusDiv.innerHTML = data.message;
                    statusDiv.style.color = "green";

                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('somaj_' + anImportat + '_' + lunaImportata)) {
                            localStorage.removeItem(key);
                        }
                    }
                    statusDiv.innerHTML += "<br><b style='color: green;'>Cache local invalidat pentru luna " + lunaImportata + "/" + anImportat + "!</b>";

                    this.reset();
                } else {
                    statusDiv.innerHTML = "Eroare: " + data.message;
                    statusDiv.style.color = "red";
                }
            })
            .catch(error => {
                statusDiv.innerHTML = "Eroare la comunicarea cu serverul.";
                statusDiv.style.color = "red";
                console.error("Fetch error:", error);
            });
        });
    </script>
</body>
</html>
